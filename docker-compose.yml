services:
  cms:
    build: .
    working_dir: /app/apps/cms/health-cms
    command: bash -lc "pnpm run build && pnpm run start"
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./apps/cms/health-cms/.env.production.local
    networks:
      - default
      - health-db

  astro:
    build: .
    working_dir: /app/apps/frontend
    command: bash -lc "pnpm build && HOST=0.0.0.0 PORT=4321 pnpm start"
    restart: always
    environment:
      PUBLIC_CMS_URL: http://cms:3000
      PUBLIC_CMS_PUBLIC_URL: https://cms.zacklown.com
    ports:
      - "4321:4321"

networks:
  health-db:
    external: true
